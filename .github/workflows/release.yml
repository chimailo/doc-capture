name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: packages/opencv-build/dist
          key: opencv-${{ hashFiles('packages/opencv-build/Dockerfile', 'packages/opencv-build/build-inside.sh', 'packages/opencv-build/opencv_js.config.py') }}
          fail-on-cache-miss: true
      - run: pnpm build
      # Opens a "Version packages" PR from .changeset/*.md; publishes when it is merged.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
